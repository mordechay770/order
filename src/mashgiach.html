<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Машгиах — Надзор кашрута</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}

#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.auth-card{background:#1e293b;border-radius:16px;padding:40px 32px;width:100%;max-width:380px;text-align:center}
.auth-card h1{font-size:24px;margin-bottom:8px}
.auth-card p{color:#94a3b8;font-size:14px;margin-bottom:24px}
.auth-card input{width:100%;padding:12px 16px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:16px;margin-bottom:16px;outline:none}
.auth-card input:focus{border-color:#16a34a}
.auth-card button{width:100%;padding:12px;border-radius:10px;border:none;background:#16a34a;color:#fff;font-size:16px;cursor:pointer;font-weight:700}

#app{display:none;flex-direction:column;min-height:100vh}
header{background:#1e293b;border-bottom:1px solid #334155;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header h1{font-size:18px;font-weight:700;margin-right:auto}
.hbtn{background:#334155;border:none;color:#94a3b8;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}
.hbtn:hover{background:#475569;color:#e2e8f0}
#last-update{font-size:12px;color:#64748b}

/* Layout: left=calendar+orders, right=kosher panel */
.app-body{display:flex;flex:1;min-height:0;gap:0}
.main-pane{flex:1;overflow-y:auto;padding:20px}
.kosher-pane{width:320px;flex-shrink:0;border-left:1px solid #334155;overflow-y:auto;padding:16px;background:#1e293b}
@media(max-width:900px){.app-body{flex-direction:column}.kosher-pane{width:100%;border-left:none;border-top:1px solid #334155}}

/* Calendar */
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:20px}
.cal-day{border:1px solid #334155;border-radius:8px;padding:8px 6px;cursor:pointer;text-align:center;transition:background .15s}
.cal-day:hover{background:#334155}
.cal-day.active{background:#16a34a;border-color:#16a34a;color:#fff}
.cal-day.today-marker{border-color:#f59e0b}
.cal-day-name{font-size:10px;color:#64748b;margin-bottom:2px}
.cal-day-num{font-size:16px;font-weight:700}
.cal-day-count{font-size:10px;margin-top:2px;border-radius:99px;padding:1px 6px;display:inline-block}
.count-0{color:#475569}
.count-pos{background:#16a34a22;color:#4ade80}

/* Status legend */
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#94a3b8}
.ldot{width:10px;height:10px;border-radius:50%}

/* Orders */
.day-title{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.order-card{background:#0f172a;border-radius:10px;padding:14px;border:1px solid #334155;margin-bottom:10px;cursor:default}
.order-card.has-kosher{border-left:3px solid #f59e0b}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.order-num{font-size:18px;font-weight:800;color:#4ade80}
.order-customer{font-size:13px;color:#cbd5e1;font-weight:600}
.order-meta{font-size:11px;color:#64748b}
.status-pill{border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.s-wait{background:#f59e0b22;color:#fbbf24;border:1px solid #f59e0b44}
.s-conf{background:#22c55e22;color:#4ade80;border:1px solid #22c55e44}
.s-ready{background:#6366f122;color:#a5b4fc;border:1px solid #6366f144}
.s-cancel{background:#ef444422;color:#f87171;border:1px solid #ef444444}
.s-other{background:#33415544;color:#64748b;border:1px solid #33415566}

.dishes-list{list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13px}
.dishes-list li{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #1e293b;color:#cbd5e1}
.dishes-list li:last-child{border-bottom:none}
.dish-qty{font-weight:700;color:#4ade80}
.kosher-flag{font-size:11px;background:#f59e0b22;color:#fbbf24;border-radius:4px;padding:1px 5px;margin-left:4px}
.card-notes{font-size:12px;color:#64748b;font-style:italic;margin-top:6px;padding-top:6px;border-top:1px solid #334155}

/* Kosher pane */
.kosher-pane h2{font-size:14px;font-weight:700;color:#fbbf24;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.kosher-search{width:100%;padding:8px 12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:13px;margin-bottom:12px;outline:none}
.kosher-search:focus{border-color:#f59e0b}
.kosher-item{background:#0f172a;border-radius:8px;padding:12px;margin-bottom:8px;border:1px solid #334155}
.kosher-product{font-size:13px;font-weight:600;color:#e2e8f0;margin-bottom:4px}
.kosher-type{font-size:11px;border-radius:4px;padding:2px 6px;display:inline-block;margin-bottom:6px}
.kt-worms{background:#ef444422;color:#f87171}
.kt-check{background:#f59e0b22;color:#fbbf24}
.kt-watch{background:#6366f122;color:#a5b4fc}
.kt-jewish{background:#22c55e22;color:#4ade80}
.kosher-desc{font-size:12px;color:#94a3b8;line-height:1.5}
.kosher-notes{font-size:11px;color:#64748b;font-style:italic;margin-top:4px}
.kosher-status{font-size:11px;border-radius:4px;padding:2px 6px;display:inline-block;margin-top:4px}
.ks-need-cert{background:#ef444422;color:#f87171}
.ks-check-ing{background:#f59e0b22;color:#fbbf24}
.ks-presumed{background:#22c55e22;color:#4ade80}
.ks-not-kosher{background:#dc262622;color:#ef4444}

/* View tabs */
.view-tabs{display:flex;gap:4px;margin-bottom:16px}
.vtab{padding:7px 14px;border-radius:8px;border:1px solid #334155;background:transparent;color:#94a3b8;font-size:13px;cursor:pointer;font-weight:600}
.vtab.active{background:#16a34a;border-color:#16a34a;color:#fff}

/* Kosher dish cards */
.kdish-card{background:#0f172a;border-radius:10px;padding:14px;border:1px solid #f59e0b44;margin-bottom:10px}
.kdish-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.kdish-name{font-size:15px;font-weight:700;color:#fbbf24}
.kdish-qty{font-size:22px;font-weight:800;color:#4ade80;white-space:nowrap}
.kdish-qty-label{font-size:10px;color:#64748b;text-align:right}
.kdish-orders{font-size:11px;color:#64748b;margin-bottom:8px}
.kdish-rules{display:flex;flex-direction:column;gap:6px}
.kdish-rule{background:#1e293b;border-radius:6px;padding:8px 10px;border-left:3px solid #f59e0b}
.kdish-rule-type{font-size:11px;font-weight:700;margin-bottom:3px}
.kdish-rule-status{font-size:11px;border-radius:4px;padding:2px 6px;display:inline-block;margin-bottom:4px}
.kdish-rule-desc{font-size:12px;color:#94a3b8;line-height:1.4}
.kdish-rule-notes{font-size:11px;color:#64748b;font-style:italic;margin-top:3px}

.empty{text-align:center;padding:40px 20px;color:#475569}
.loading{text-align:center;padding:40px 20px;color:#64748b}

/* PRINT */
@media print {
  header,.kosher-pane,.legend,#auth-screen{display:none!important}
  body{background:#fff;color:#000}
  #app{display:block!important}
  .app-body{display:block!important}
  .main-pane{padding:0}
  .order-card{border:1px solid #ccc;break-inside:avoid;margin-bottom:8px;background:#fff}
  .order-num,.order-customer{color:#000}
  .dish-qty{color:#333}
  .calendar{display:none!important}
}
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <div style="font-size:40px;margin-bottom:12px">🔍</div>
    <h1>Машгиах</h1>
    <p>Надзор кашрута — введите токен</p>
    <input type="password" id="token-input" placeholder="Токен" autocomplete="off">
    <button onclick="login()">Войти</button>
    <div id="auth-error" style="color:#f87171;font-size:13px;margin-top:12px;display:none">Неверный токен</div>
  </div>
</div>

<div id="app">
  <header>
    <h1>🔍 Надзор кашрута</h1>
    <button class="hbtn" onclick="window.print()">🖨 Печать</button>
    <button class="hbtn" onclick="loadAll()">↻ Обновить</button>
    <span id="last-update"></span>
  </header>

  <div class="app-body">
    <div class="main-pane">
      <div id="calendar" class="calendar"></div>
      <div class="legend">
        <div class="legend-item"><div class="ldot" style="background:#22c55e"></div>Подтверждён</div>
        <div class="legend-item"><div class="ldot" style="background:#f59e0b"></div>Ожидает</div>
        <div class="legend-item"><div class="ldot" style="background:#6366f1"></div>Готов</div>
        <div class="legend-item"><div class="ldot" style="background:#ef4444"></div>Отменён</div>
        <div class="legend-item"><div class="ldot" style="background:#f59e0b;width:4px;height:10px;border-radius:2px"></div>Требует проверки</div>
      </div>
      <div class="view-tabs">
        <button class="vtab active" onclick="setView('orders',this)">📋 Заказы</button>
        <button class="vtab" onclick="setView('kosher-dishes',this)">✡️ Кашрут в меню</button>
        <button class="vtab" onclick="setView('production',this)">🏭 Производство</button>
      </div>
      <div id="orders-content"><div class="loading">Загрузка...</div></div>
    </div>

    <div class="kosher-pane">
      <h2>✡️ Требования кашрута</h2>
      <input type="text" class="kosher-search" id="kosher-search" placeholder="Поиск продукта..." oninput="filterKosher()">
      <div id="kosher-list"><div class="loading">Загрузка...</div></div>
    </div>
  </div>
</div>

<script>
const API = '/api';
let mashToken = '';
let allOrders = [];
let allKosher = [];
let allProd   = [];
let byDay = {};
let selectedDay = null;
let currentView = 'orders';

const DAYS_RU = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const MONTHS_RU = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

function login() {
  const val = document.getElementById('token-input').value.trim();
  if (!val) return;
  mashToken = val;
  loadAll(true);
}
document.getElementById('token-input').addEventListener('keydown', e => { if(e.key==='Enter') login(); });

async function loadAll(isAuth = false) {
  try {
    const [ordersRes, kosherRes, prodRes] = await Promise.all([
      fetch(`${API}/orders-today?token=${encodeURIComponent(mashToken)}&range=week&all_statuses=1`),
      fetch(`${API}/orders-today?token=${encodeURIComponent(mashToken)}&type=kosher`),
      fetch(`${API}/production?token=${encodeURIComponent(mashToken)}&range=week`),
    ]);

    if (ordersRes.status === 403) { if(isAuth) document.getElementById('auth-error').style.display='block'; return; }
    if (!ordersRes.ok) throw new Error(await ordersRes.text());

    if (isAuth) {
      localStorage.setItem('mashgiach_token', mashToken);
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
    }

    const ordersData = await ordersRes.json();
    allOrders = ordersData.orders || [];

    if (kosherRes.ok) { const kd = await kosherRes.json(); allKosher = kd.requirements || []; }
    if (prodRes.ok)   { const pd = await prodRes.json();  allProd   = pd.records || []; }

    // Group orders by day (YYYY-MM-DD in Almaty timezone)
    byDay = {};
    for (const o of allOrders) {
      const day = o.delivery_at
        ? new Date(o.delivery_at).toLocaleDateString('en-CA', {timeZone:'Asia/Almaty'})
        : 'unknown';
      if (!byDay[day]) byDay[day] = [];
      byDay[day].push(o);
    }

    renderCalendar();
    renderKosher();
    document.getElementById('last-update').textContent = new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});

    // Auto-select today
    const todayKey = new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Almaty'});
    selectedDay = todayKey;
    renderCalendar();
    refreshContent();
  } catch(err) {
    document.getElementById('orders-content').innerHTML = `<div class="empty"><p>Ошибка: ${err.message}</p></div>`;
  }
}

function renderCalendar() {
  const cal = document.getElementById('calendar');
  const todayKey = new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Almaty'});
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    const key = d.toLocaleDateString('en-CA', {timeZone:'Asia/Almaty'});
    const count = (byDay[key] || []).length;
    const dow = DAYS_RU[d.getDay()];
    const dayNum = d.toLocaleDateString('ru-RU',{day:'numeric',timeZone:'Asia/Almaty'});
    days.push({key, count, dow, dayNum, isToday: key === todayKey});
  }

  cal.innerHTML = days.map(d => `
    <div class="cal-day ${d.key===selectedDay?'active':''} ${d.isToday&&d.key!==selectedDay?'today-marker':''}"
         onclick="selectDay('${d.key}')">
      <div class="cal-day-name">${d.dow}</div>
      <div class="cal-day-num">${d.dayNum}</div>
      <div class="cal-day-count ${d.count?'count-pos':'count-0'}">${d.count||'–'}</div>
    </div>`).join('');
}

function setView(view, btn) {
  currentView = view;
  document.querySelectorAll('.vtab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  refreshContent();
}

function selectDay(key) {
  selectedDay = key;
  renderCalendar();
  refreshContent();
}

function refreshContent() {
  if (currentView === 'production') { renderProductionView(); return; }
  const orders = byDay[selectedDay] || [];
  if (currentView === 'kosher-dishes') renderKosherDishes(orders);
  else renderOrders(orders);
}

// Build a set of kosher product names for quick lookup
function buildKosherSet() {
  const s = new Set();
  for (const k of allKosher) if (k.product) s.add(k.product.toLowerCase());
  return s;
}

function renderOrders(orders) {
  const content = document.getElementById('orders-content');
  const kosherSet = buildKosherSet();

  if (!orders.length) { content.innerHTML = '<div class="empty"><p>Нет заказов на этот день</p></div>'; return; }

  const d = new Date(selectedDay + 'T12:00:00');
  const dateStr = d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  let html = `<div class="day-title">📅 ${dateStr}<span style="color:#64748b;font-size:13px">${orders.length} заказов</span></div>`;

  for (const o of orders) {
    // Check if any dish might require kosher attention
    const hasKosherDish = o.items.some(i => i.name && checkDishKosher(i.name, kosherSet));
    const badgeCls = statusBadgeClass(o.status);
    const time = o.delivery_at ? new Date(o.delivery_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Almaty'}) : '—';

    const dishesHtml = o.items.length
      ? `<ul class="dishes-list">${o.items.map(i => {
          const kFlag = checkDishKosher(i.name, kosherSet) ? `<span class="kosher-flag">✡</span>` : '';
          return `<li><span>${esc(i.name)}${kFlag}</span><span class="dish-qty">×${i.quantity}</span></li>`;
        }).join('')}</ul>`
      : `<p style="color:#475569;font-size:12px">Нет позиций</p>`;

    const notes = (o.kitchen_notes || o.notes)
      ? `<div class="card-notes">📝 ${esc(o.kitchen_notes||o.notes)}</div>` : '';

    html += `<div class="order-card ${hasKosherDish?'has-kosher':''}">
      <div class="card-top">
        <div>
          <div class="order-num">#${o.order_number||'—'}</div>
          <div class="order-customer">${esc(o.customer)}${o.phone?` · ${esc(o.phone)}`:''}</div>
          <div class="order-meta">${esc(o.order_type)} · ${time}${o.people?' · '+o.people+' чел.':''}</div>
        </div>
        <span class="status-pill ${badgeCls}">${esc(o.status)}</span>
      </div>
      ${dishesHtml}${notes}
      ${hasKosherDish?'<div style="font-size:11px;color:#fbbf24;margin-top:6px">⚠️ Требует проверки кашрута</div>':''}
    </div>`;
  }

  content.innerHTML = html;
}

function renderKosherDishes(orders) {
  const content = document.getElementById('orders-content');
  if (!orders.length) { content.innerHTML = '<div class="empty"><p>Нет заказов на этот день</p></div>'; return; }

  // Aggregate dishes from all orders in this day
  const dishMap = {}; // dishName → { total, orders: [{num, qty}] }
  for (const o of orders) {
    for (const item of o.items) {
      if (!item.name || item.name === '—') continue;
      if (!dishMap[item.name]) dishMap[item.name] = { total: 0, orderNums: [] };
      dishMap[item.name].total += item.quantity;
      dishMap[item.name].orderNums.push(`#${o.order_number||'?'}×${item.quantity}`);
    }
  }

  // For each dish, find all matching kosher entries
  const results = [];
  for (const [dishName, agg] of Object.entries(dishMap)) {
    const matches = findKosherMatches(dishName);
    if (matches.length) results.push({ dishName, ...agg, matches });
  }

  if (!results.length) {
    content.innerHTML = '<div class="empty"><p style="color:#4ade80">✅ Все блюда в меню на этот день не требуют особого контроля кашрута</p></div>';
    return;
  }

  const d = new Date(selectedDay + 'T12:00:00');
  const dateStr = d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  let html = `<div class="day-title">✡️ ${dateStr} — <span style="color:#fbbf24">${results.length} блюд требуют проверки</span></div>`;

  for (const r of results.sort((a,b) => b.total - a.total)) {
    const rulesHtml = r.matches.map(k => {
      const typeCls   = TYPE_CLASS[k.type]   || 'kt-check';
      const typeLabel = TYPE_LABEL[k.type]   || k.type || '';
      const stsCls    = STATUS_CLASS[k.status] || 'ks-presumed';
      const stsLabel  = STATUS_LABEL[k.status] || k.status || '';
      const desc = k.desc_ru || k.desc_he || '';
      return `<div class="kdish-rule">
        ${typeLabel ? `<div class="kdish-rule-type ${typeCls}">⬤ ${typeLabel}</div>` : ''}
        ${stsLabel  ? `<span class="kdish-rule-status ${stsCls}">${stsLabel}</span>` : ''}
        ${desc      ? `<div class="kdish-rule-desc">${esc(desc)}</div>` : ''}
        ${k.notes   ? `<div class="kdish-rule-notes">📝 ${esc(k.notes)}</div>` : ''}
      </div>`;
    }).join('');

    html += `<div class="kdish-card">
      <div class="kdish-header">
        <div class="kdish-name">⚠️ ${esc(r.dishName)}</div>
        <div style="text-align:right">
          <div class="kdish-qty">${r.total}</div>
          <div class="kdish-qty-label">шт.</div>
        </div>
      </div>
      <div class="kdish-orders">Заказы: ${r.orderNums.join(', ')}</div>
      <div class="kdish-rules">${rulesHtml}</div>
    </div>`;
  }

  content.innerHTML = html;
}

function renderProductionView() {
  const content = document.getElementById('orders-content');
  const stLbl = {'הוזמן':'Ожидает','בייצור':'В производстве','מוכן':'Готово','הועבר למלאי':'Передано'};
  const stCls = {'הוזמן':'s-other','בייצור':'s-wait','מוכן':'s-conf','הועבר למלאי':'s-ready'};
  const destLbl = d => d === 'לחנות' ? '→ Магазин' : d === 'למטבח' ? '→ Кухня' : d || '';
  const today = new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Almaty'});

  // Filter by selected day if set
  const filtered = selectedDay
    ? allProd.filter(r => r.date && r.date.slice(0,10) === selectedDay)
    : allProd;

  if (!filtered.length) {
    content.innerHTML = '<div class="empty"><p>Нет заказов на производство</p></div>';
    return;
  }

  // Group by date
  const byDate = {};
  for (const r of filtered) {
    const dk = r.date ? r.date.slice(0,10) : 'unknown';
    if (!byDate[dk]) byDate[dk] = [];
    byDate[dk].push(r);
  }

  let html = '';
  for (const [dk, recs] of Object.entries(byDate).sort()) {
    const d = new Date(dk + 'T12:00:00');
    const label = dk === today ? `📅 Сегодня — ${d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}` : d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
    html += `<div class="day-title">${label}</div>`;
    for (const r of recs) {
      html += `<div class="order-card" style="margin-bottom:8px">
        <div class="card-top">
          <div>
            <div class="order-customer" style="font-size:15px;font-weight:700">${esc(r.name_ru||'?')}</div>
            ${r.destination ? `<div class="order-meta">${destLbl(r.destination)}</div>` : ''}
            ${r.notes ? `<div class="order-meta">${esc(r.notes)}</div>` : ''}
          </div>
          <div style="text-align:right">
            <div style="font-size:24px;font-weight:800;color:#fbbf24">${r.requested_qty||'?'}</div>
            ${r.actual_qty ? `<div style="font-size:12px;color:#4ade80">✓ ${r.actual_qty} готово</div>` : ''}
          </div>
        </div>
        <span class="status-pill ${stCls[r.status]||'s-other'}">${stLbl[r.status]||r.status}</span>
      </div>`;
    }
  }
  content.innerHTML = html;
}

function findKosherMatches(dishName) {
  const lower = dishName.toLowerCase();
  return allKosher.filter(k => {
    if (!k.product) return false;
    const kl = k.product.toLowerCase();
    return lower.includes(kl) || kl.includes(lower);
  });
}

function checkDishKosher(dishName, kosherSet) {
  // Simple heuristic: check if dish name contains any kosher-sensitive product name
  const lower = dishName.toLowerCase();
  for (const kp of kosherSet) if (lower.includes(kp) || kp.includes(lower)) return true;
  return false;
}

function statusBadgeClass(status) {
  const m = {'Подтверждён':'s-conf','Ожидает':'s-wait','Готов':'s-ready','Отменён':'s-cancel'};
  return m[status] || 's-other';
}

function renderKosher() {
  filterKosher();
}

const TYPE_CLASS = {
  'בדיקת תולעים':'kt-worms',
  'בדיקת מוצר':'kt-check',
  'השגחה צמודה':'kt-watch',
  'הדלקת המכשיר ע"י יהודי':'kt-jewish',
};
const STATUS_CLASS = {
  'נדרשת חותמת כשרות':'ks-need-cert',
  'נדרשת בדיקת רכיבים':'ks-check-ing',
  'בחזקת כשרות':'ks-presumed',
  'לא כשר':'ks-not-kosher',
};
const TYPE_LABEL = {
  'בדיקת תולעים':'Проверка на червей',
  'בדיקת מוצר':'Проверка продукта',
  'השגחה צמודה':'Непосредственный надзор',
  'הדלקת המכשיר ע"י יהודי':'Включение евреем',
};
const STATUS_LABEL = {
  'נדרשת חותמת כשרות':'Нужна печать кашрута',
  'נדרשת בדיקת רכיבים':'Нужна проверка ингредиентов',
  'בחזקת כשרות':'Предполагается кашерным',
  'לא כשר':'Некошерно',
};

function filterKosher() {
  const q = (document.getElementById('kosher-search').value||'').toLowerCase();
  const filtered = allKosher.filter(k =>
    !q || k.product.toLowerCase().includes(q) ||
    (k.desc_he||'').toLowerCase().includes(q) ||
    (k.desc_ru||'').toLowerCase().includes(q)
  );
  const list = document.getElementById('kosher-list');
  if (!filtered.length) { list.innerHTML = '<div class="empty" style="padding:20px">Не найдено</div>'; return; }
  list.innerHTML = filtered.map(k => {
    const typeCls   = TYPE_CLASS[k.type]   || 'kt-check';
    const typeLabel = TYPE_LABEL[k.type]   || k.type;
    const stsCls    = STATUS_CLASS[k.status] || 'ks-presumed';
    const stsLabel  = STATUS_LABEL[k.status] || k.status;
    const desc = k.desc_ru || k.desc_he || '';
    return `<div class="kosher-item">
      <div class="kosher-product">${esc(k.product)}</div>
      <span class="kosher-type ${typeCls}">${typeLabel}</span>
      ${k.status?`<span class="kosher-status ${stsCls}">${stsLabel}</span>`:''}
      ${desc?`<div class="kosher-desc">${esc(desc)}</div>`:''}
      ${k.notes?`<div class="kosher-notes">${esc(k.notes)}</div>`:''}
    </div>`;
  }).join('');
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
