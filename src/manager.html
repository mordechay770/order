<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Менеджер — Кухня</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f1f5f9; min-height: 100vh; }

/* ── Login ── */
.login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
.login-card { background: #1e293b; border-radius: 20px; padding: 36px 28px; width: 100%; max-width: 380px; }
.login-card h1 { font-size: 22px; margin-bottom: 6px; }
.login-card p  { color: #64748b; font-size: 14px; margin-bottom: 24px; }
.login-card input { width: 100%; background: #0f172a; border: 1.5px solid #334155; border-radius: 10px; padding: 12px 14px; color: #f1f5f9; font-size: 15px; outline: none; }
.login-card input:focus { border-color: #6366f1; }

/* ── Layout ── */
.app { display: none; flex-direction: column; min-height: 100vh; }
.app.visible { display: flex; }
.topbar { background: #1e293b; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 100; }
.topbar h1 { font-size: 17px; }
.topbar-right { display: flex; gap: 8px; align-items: center; }

/* ── Tabs ── */
.tabs { display: flex; background: #1e293b; border-bottom: 1px solid #334155; }
.tab-btn { flex: 1; padding: 12px 8px; background: none; border: none; color: #64748b; font-size: 14px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; }
.tab-btn.active { color: #6366f1; border-bottom-color: #6366f1; }

/* ── Date filter ── */
.date-filter { display: flex; gap: 6px; padding: 12px 14px; overflow-x: auto; background: #0f172a; border-bottom: 1px solid #1e293b; }
.date-filter::-webkit-scrollbar { display: none; }
.df-btn { flex-shrink: 0; padding: 7px 14px; border-radius: 99px; border: 1.5px solid #334155; background: none; color: #94a3b8; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; white-space: nowrap; }
.df-btn.active { background: #6366f1; border-color: #6366f1; color: #fff; }
.custom-range { display: none; padding: 8px 14px 4px; gap: 8px; align-items: center; }
.custom-range.show { display: flex; }
.custom-range input[type="date"] { background: #1e293b; border: 1.5px solid #334155; border-radius: 8px; padding: 6px 10px; color: #f1f5f9; font-size: 13px; }
.status-filter { display: flex; gap: 6px; padding: 6px 14px 10px; overflow-x: auto; }
.status-filter::-webkit-scrollbar { display: none; }
.sf-btn { flex-shrink: 0; padding: 5px 12px; border-radius: 99px; border: 1.5px solid #334155; background: none; color: #94a3b8; font-size: 12px; font-weight: 600; cursor: pointer; }
.sf-btn.active { border-color: #6366f1; color: #6366f1; background: #6366f122; }

/* ── Stats bar ── */
.stats-bar { display: flex; gap: 12px; padding: 10px 14px; background: #0f172a; }
.stat-chip { background: #1e293b; border-radius: 10px; padding: 8px 14px; font-size: 12px; color: #64748b; }
.stat-chip strong { display: block; font-size: 18px; color: #f1f5f9; font-weight: 700; }

/* ── Order list ── */
.orders-list { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.order-card { background: #1e293b; border-radius: 14px; padding: 14px; cursor: pointer; border: 1.5px solid transparent; transition: border-color .15s; }
.order-card:hover { border-color: #6366f1; }
.order-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.order-num { font-size: 13px; color: #64748b; font-weight: 600; }
.order-total { font-size: 15px; font-weight: 700; color: #fde047; }
.order-name { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.order-meta { font-size: 12px; color: #64748b; display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.order-meta span { display: flex; align-items: center; gap: 3px; }
.status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; }
.s-wait   { background: #fef9c322; color: #fde047; }
.s-ok     { background: #dcfce722; color: #86efac; }
.s-ready  { background: #fff7ed22; color: #fdba74; }
.s-cancel { background: #fee2e222; color: #fca5a5; }
.s-proc   { background: #e0e7ff22; color: #a5b4fc; }
.s-other  { background: #334155;   color: #94a3b8; }

/* ── Modal ── */
.modal-backdrop { display: none; position: fixed; inset: 0; background: #000a; z-index: 1000; overflow-y: auto; padding: 16px; }
.modal-backdrop.open { display: flex; align-items: flex-start; justify-content: center; }
.modal { background: #1e293b; border-radius: 20px; width: 100%; max-width: 560px; padding: 20px; }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.modal-header h2 { font-size: 18px; }
.close-btn { background: #334155; border: none; color: #94a3b8; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

.section-title { font-size: 11px; font-weight: 700; color: #6366f1; text-transform: uppercase; letter-spacing: .06em; margin: 16px 0 8px; }
.detail-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #334155; font-size: 14px; gap: 8px; }
.detail-row:last-child { border-bottom: none; }
.detail-label { color: #64748b; flex-shrink: 0; }
.detail-value { font-weight: 600; text-align: right; word-break: break-word; }
.editable-field { background: #0f172a; border: 1.5px solid #334155; border-radius: 8px; padding: 8px 10px; color: #f1f5f9; font-size: 14px; width: 100%; resize: vertical; min-height: 60px; font-family: inherit; }
.editable-field:focus { outline: none; border-color: #6366f1; }
.input-field { background: #0f172a; border: 1.5px solid #334155; border-radius: 8px; padding: 8px 10px; color: #f1f5f9; font-size: 14px; width: 100%; font-family: inherit; }
.input-field:focus { outline: none; border-color: #6366f1; }
select.input-field { cursor: pointer; }

/* Items table */
.items-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.items-table th { color: #6366f1; text-align: left; padding: 4px 6px; font-weight: 600; border-bottom: 1px solid #334155; }
.items-table td { padding: 7px 6px; border-bottom: 1px solid #334155; }
.items-table tr:last-child td { border-bottom: none; }
.qty-input { width: 60px; background: #0f172a; border: 1.5px solid #334155; border-radius: 6px; padding: 4px 6px; color: #f1f5f9; font-size: 13px; text-align: center; }

/* Actions */
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.btn { border: none; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity .15s, transform .1s; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: default; }
.btn-full { grid-column: 1/-1; }
.btn-approve { background: #22c55e; color: #fff; }
.btn-ready   { background: #f59e0b; color: #fff; }
.btn-cancel  { background: #ef4444; color: #fff; }
.btn-save    { background: #6366f1; color: #fff; }
.btn-primary { background: #6366f1; color: #fff; }
.btn-ghost   { background: #334155; color: #94a3b8; }
.btn-wa      { background: #25d366; color: #fff; text-decoration: none; }

/* Payment section */
.pay-row { display: flex; gap: 8px; margin-top: 8px; }
.pay-row input { flex: 1; }

/* Production tab (reuse from production.html) */
.prod-section { padding: 12px; }
.prod-form { background: #1e293b; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.prod-form .form-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.prod-form select, .prod-form input { flex: 1; min-width: 120px; background: #0f172a; border: 1.5px solid #334155; border-radius: 8px; padding: 8px 10px; color: #f1f5f9; font-size: 14px; }
.prod-card { background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 8px; }
.prod-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.prod-name { font-weight: 700; font-size: 15px; }
.prod-dest { font-size: 12px; color: #94a3b8; }
.prod-qty  { font-size: 20px; font-weight: 700; color: #fde047; }
.prod-status { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; }
.ps-new      { background: #33415522; color: #94a3b8; }
.ps-active   { background: #fef9c322; color: #fde047; }
.ps-done     { background: #dcfce722; color: #86efac; }
.ps-sent     { background: #e0e7ff22; color: #a5b4fc; }
.prod-btn    { background: #6366f1; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px; }
.date-group-label { font-size: 12px; font-weight: 700; color: #6366f1; padding: 8px 0 4px; text-transform: uppercase; letter-spacing: .04em; }

/* Utilities */
.spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid #ffffff44; border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; color: #475569; padding: 40px 0; font-size: 14px; }
.err { color: #fca5a5; font-size: 13px; margin-top: 8px; text-align: center; }
.loading { text-align: center; padding: 40px 0; color: #475569; }
.tag { display: inline-block; background: #334155; color: #94a3b8; border-radius: 6px; padding: 2px 8px; font-size: 11px; margin-left: 4px; }
</style>
</head>
<body>

<!-- Login -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div style="font-size:32px;margin-bottom:12px">🍽️</div>
    <h1>Вход для менеджера</h1>
    <p>Введите токен доступа</p>
    <input type="password" id="tokenInput" placeholder="Токен..." autocomplete="off">
    <button class="btn btn-primary btn-full" style="margin-top:12px" onclick="doLogin()">Войти</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- App -->
<div class="app" id="appWrap">
  <div class="topbar">
    <h1>🍽️ Менеджер</h1>
    <div class="topbar-right">
      <button class="btn btn-primary" style="padding:6px 12px;font-size:12px" onclick="openNewOrder()">+ Заказ</button>
      <button class="btn btn-ghost" style="padding:6px 12px;font-size:12px" onclick="reload()">⟳</button>
      <button class="btn btn-ghost" style="padding:6px 12px;font-size:12px" onclick="logout()">Выход</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="setTab('orders',this)">📋 Заказы</button>
    <button class="tab-btn" onclick="setTab('production',this)">🏭 Производство</button>
  </div>

  <!-- Orders Tab -->
  <div id="tabOrders">
    <div class="date-filter">
      <button class="df-btn active" onclick="setRange('today',this)">Сегодня</button>
      <button class="df-btn" onclick="setRange('tomorrow',this)">Завтра</button>
      <button class="df-btn" onclick="setRange('week',this)">7 дней</button>
      <button class="df-btn" onclick="setRange('this_week',this)">Эта неделя</button>
      <button class="df-btn" onclick="setRange('month',this)">Месяц</button>
      <button class="df-btn" onclick="setRange('custom',this)">📅 Период</button>
    </div>
    <div class="custom-range" id="customRange">
      <input type="date" id="dateFrom"> — <input type="date" id="dateTo">
      <button class="btn btn-primary" style="padding:6px 14px;font-size:13px" onclick="loadCustomRange()">OK</button>
    </div>

    <div class="status-filter" id="statusFilter">
      <button class="sf-btn active" onclick="setStatusFilter('all',this)">Все</button>
      <button class="sf-btn" onclick="setStatusFilter('Ожидает подтверждения менеджера',this)">⏳ Ожидает</button>
      <button class="sf-btn" onclick="setStatusFilter('Подтверждён',this)">✅ Подтверждён</button>
      <button class="sf-btn" onclick="setStatusFilter('Готов',this)">🍽️ Готов</button>
      <button class="sf-btn" onclick="setStatusFilter('Отменён',this)">❌ Отменён</button>
      <button class="sf-btn" onclick="setStatusFilter('В обработке',this)">🔄 В обработке</button>
    </div>

    <div class="stats-bar" id="statsBar"></div>
    <div class="orders-list" id="ordersList"></div>
  </div>

  <!-- Production Tab -->
  <div id="tabProduction" style="display:none">
    <div class="prod-section">
      <div class="prod-form">
        <div style="font-size:14px;font-weight:700;color:#6366f1;margin-bottom:10px">+ Новый заказ на производство</div>
        <div class="form-row">
          <select id="pf-recipe" onchange="onPFRecipeChange(this)"><option value="">— Выбрать рецепт —</option></select>
          <select id="pf-dest">
            <option value="למלאי">→ Склад кухни</option>
            <option value="לחנות">→ Магазин</option>
          </select>
        </div>
        <div class="form-row">
          <input type="number" id="pf-qty" placeholder="Кол-во" min="1">
          <input type="date" id="pf-date">
          <button class="btn btn-primary" style="flex:0;padding:8px 16px" onclick="submitProdOrder()">Заказать</button>
        </div>
        <div style="font-size:12px;color:#64748b;margin-top:2px" id="pf-unit"></div>
      </div>
      <div id="prodList"><div class="loading"><span class="spinner"></span></div></div>
    </div>
  </div>
</div>

<!-- Order Modal -->
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModalOnBg(event)">
  <div class="modal" id="modalContent"></div>
</div>

<!-- New Order Modal -->
<div class="modal-backdrop" id="newOrderBackdrop" onclick="if(event.target===this)closeNewOrder()" style="display:none;align-items:flex-start;justify-content:center">
  <div class="modal" style="max-width:520px">
    <div class="modal-header">
      <h2>+ Новый заказ</h2>
      <button class="close-btn" onclick="closeNewOrder()">✕</button>
    </div>

    <div class="section-title">Клиент</div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input class="input-field" id="no-phone" placeholder="Телефон..." style="flex:2" oninput="onPhoneInput(this)">
      <button class="btn btn-ghost" style="flex:0;padding:8px 12px;font-size:13px" onclick="searchContact()">🔍</button>
    </div>
    <div id="no-contact-result" style="margin-bottom:8px"></div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input class="input-field" id="no-fname" placeholder="Имя..." style="flex:1">
      <input class="input-field" id="no-lname" placeholder="Фамилия..." style="flex:1">
    </div>

    <div class="section-title">Заказ</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <input class="input-field" id="no-type" placeholder="Тип заказа..." style="flex:2">
      <input class="input-field" type="datetime-local" id="no-date" style="flex:2">
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <input class="input-field" type="number" id="no-people" placeholder="Гостей..." style="flex:1">
      <select class="input-field" id="no-payment" style="flex:1">
        <option value="">— Оплата —</option>
      </select>
    </div>
    <textarea class="editable-field" id="no-notes" placeholder="Примечания..." style="min-height:50px;width:100%;margin-bottom:8px"></textarea>
    <textarea class="editable-field" id="no-kitchen" placeholder="Заметки для кухни..." style="min-height:40px;width:100%;margin-bottom:8px"></textarea>
    <div style="display:flex;gap:8px">
      <select class="input-field" id="no-delivery" style="flex:1">
        <option value="">— Доставка —</option>
        <option value="משלוח">🚚 Доставка</option>
        <option value="איסוף עצמי">🏪 Самовывоз</option>
      </select>
      <input class="input-field" id="no-addr" placeholder="Адрес..." style="flex:2">
    </div>

    <div class="action-grid" style="margin-top:16px">
      <button class="btn btn-approve btn-full" onclick="submitNewOrder()">✅ Создать заказ</button>
    </div>
    <div class="err" id="noErr"></div>
  </div>
</div>

<script>
let managerToken = '';
let currentRange = 'today';
let currentStatus = 'all';
let allOrders = [];
let allProdRecipes = [];
let editOrderId = null;
let isLoadingProd = false;

// ── Auth ────────────────────────────────────────────────────────────────────
function doLogin() {
  const t = document.getElementById('tokenInput').value.trim();
  if (!t) return;
  managerToken = t;
  localStorage.setItem('manager_token', t);
  initApp();
}

function logout() {
  localStorage.removeItem('manager_token');
  location.reload();
}

function initApp() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('appWrap').classList.add('visible');
  loadOrders();
  loadProductionRecipes();
  // default prod date to today
  const td = new Date().toISOString().slice(0,10);
  document.getElementById('pf-date').value = td;
}

// ── Tabs ────────────────────────────────────────────────────────────────────
function setTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tabOrders').style.display     = tab === 'orders'     ? '' : 'none';
  document.getElementById('tabProduction').style.display = tab === 'production' ? '' : 'none';
  if (tab === 'production' && !isLoadingProd) loadProductionOrders();
}

function reload() {
  const activeTab = document.querySelector('.tab-btn.active')?.textContent?.includes('Про') ? 'production' : 'orders';
  if (activeTab === 'orders') loadOrders();
  else loadProductionOrders();
}

// ── Date range ───────────────────────────────────────────────────────────────
function setRange(range, btn) {
  document.querySelectorAll('.df-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentRange = range;
  document.getElementById('customRange').classList.toggle('show', range === 'custom');
  if (range !== 'custom') loadOrders();
}

function setStatusFilter(status, btn) {
  document.querySelectorAll('.sf-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentStatus = status;
  renderOrders();
}

function loadCustomRange() {
  const from = document.getElementById('dateFrom').value;
  const to   = document.getElementById('dateTo').value;
  if (!from || !to) return;
  loadOrders(from, to);
}

// ── Orders ───────────────────────────────────────────────────────────────────
async function loadOrders(start, end) {
  document.getElementById('ordersList').innerHTML = '<div class="loading"><span class="spinner"></span></div>';
  document.getElementById('statsBar').innerHTML = '';
  let url = `/api/orders-today?token=${encodeURIComponent(managerToken)}&all_statuses=1`;
  if (start && end) url += `&start=${start}&end=${end}`;
  else url += `&range=${currentRange}`;
  try {
    const r = await fetch(url);
    if (r.status === 403) { logout(); return; }
    const d = await r.json();
    allOrders = d.orders || [];
    renderOrders();
  } catch {
    document.getElementById('ordersList').innerHTML = '<div class="empty">⚠️ Ошибка загрузки</div>';
  }
}

function renderOrders() {
  const filtered = currentStatus === 'all' ? allOrders : allOrders.filter(o => o.status === currentStatus);
  const totalPeople = filtered.reduce((s,o) => s + (o.people||0), 0);
  const totalItems  = filtered.reduce((s,o) => s + o.items.length, 0);
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-chip"><strong>${filtered.length}</strong>Заказов</div>
    <div class="stat-chip"><strong>${totalPeople}</strong>Гостей</div>
    <div class="stat-chip"><strong>${totalItems}</strong>Позиций</div>
  `;

  if (!filtered.length) { document.getElementById('ordersList').innerHTML = '<div class="empty">Нет заказов</div>'; return; }

  document.getElementById('ordersList').innerHTML = filtered.map(o => {
    const st = statusBadge(o.status);
    const dt = o.delivery_at ? fmtDate(o.delivery_at) : '';
    const kitNote = o.kitchen_notes ? `<span>📝 ${esc(o.kitchen_notes).slice(0,40)}</span>` : '';
    return `<div class="order-card" onclick="openOrder('${o.id}')">
      <div class="order-card-header">
        <span class="order-num">№${o.order_number}</span>
        <span class="order-total">${o.total || o.price ? (o.total || o.price) + ' ₸' : ''}</span>
      </div>
      <div class="order-name">${esc(o.customer || 'Клиент')}</div>
      <div style="font-size:13px;color:#94a3b8;margin-bottom:6px">${esc(o.order_type)}</div>
      <div class="order-meta">
        ${st}
        ${dt ? `<span>📅 ${dt}</span>` : ''}
        ${o.people ? `<span>👥 ${o.people}</span>` : ''}
        ${o.items.length ? `<span>🍽️ ${o.items.length} поз.</span>` : ''}
        ${kitNote}
      </div>
    </div>`;
  }).join('');
}

function statusBadge(s) {
  const m = {
    'Ожидает подтверждения менеджера': ['s-wait','⏳ Ожидает'],
    'Ожидает подтверждения клиента':   ['s-wait','⏳ Ожидает клиента'],
    'Ожидает':                          ['s-wait','⏳ Ожидает'],
    'Подтверждён':                      ['s-ok',  '✅ Подтверждён'],
    'Готов':                            ['s-ready','🍽️ Готов'],
    'Отменён':                          ['s-cancel','❌ Отменён'],
    'В обработке':                      ['s-proc', '🔄 В обработке'],
  };
  const [cls, label] = m[s] || ['s-other', s || '—'];
  return `<span class="status-badge ${cls}">${label}</span>`;
}

// ── Order Modal ──────────────────────────────────────────────────────────────
async function openOrder(id) {
  const o = allOrders.find(x => x.id === id);
  if (!o) return;
  editOrderId = id;
  const mc = document.getElementById('modalContent');
  mc.innerHTML = renderOrderModal(o);
  document.getElementById('modalBackdrop').classList.add('open');
  // Load payments and payment methods in parallel
  loadPaymentsForOrder(id);
  if (!allPaymentMethods.length) await loadPaymentMethods();
  else populateMethodSelect();
}

function row(label, value) {
  return `<div class="detail-row"><span class="detail-label">${label}</span><span class="detail-value">${value}</span></div>`;
}

function closeModal() { document.getElementById('modalBackdrop').classList.remove('open'); }
function closeModalOnBg(e) { if (e.target === document.getElementById('modalBackdrop')) closeModal(); }

async function quickAction(action) {
  const url = `/api/manager-action?id=${editOrderId}&action=${action}&token=${encodeURIComponent(managerToken)}`;
  setModalErr('');
  try {
    const r = await fetch(url);
    if (r.ok) { closeModal(); await loadOrders(); }
    else setModalErr('Ошибка: ' + r.status);
  } catch { setModalErr('Ошибка соединения'); }
}

async function saveOrder() {
  const status       = document.getElementById('m-status').value;
  const notes_cust   = document.getElementById('m-notes-cust').value;
  const notes_kit    = document.getElementById('m-notes-kit').value;
  const notes_int    = document.getElementById('m-notes-int').value;
  const del_addr     = document.getElementById('m-deladdr').value;
  const del_status   = document.getElementById('m-delstatus').value;
  const del_type     = document.getElementById('m-deltype').value;
  setModalErr('');

  try {
    const r = await fetch(`/api/manager-action?id=${editOrderId}&token=${encodeURIComponent(managerToken)}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        status, notes_customer: notes_cust, notes_kitchen: notes_kit,
        notes_internal: notes_int, delivery_address: del_addr,
        delivery_status: del_status, delivery_type: del_type,
      }),
    });
    if (r.ok) { closeModal(); await new Promise(res => setTimeout(res, 800)); await loadOrders(); }
    else { const d = await r.json().catch(()=>({})); setModalErr(d.error || d.detail || 'Ошибка'); }
  } catch { setModalErr('Ошибка соединения'); }
}

let allPaymentMethods = [];

async function loadPaymentMethods() {
  try {
    const r = await fetch(`/api/manager-action?action=payment_methods&token=${encodeURIComponent(managerToken)}`);
    if (!r.ok) return;
    const d = await r.json();
    allPaymentMethods = d.methods || [];
    populateMethodSelect();
  } catch {}
}

function populateMethodSelect() {
  const sel = document.getElementById('m-pay-method');
  if (!sel) return;
  sel.innerHTML = '<option value="">— Способ оплаты —</option>' +
    allPaymentMethods.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('');
}

async function loadPaymentsForOrder(orderId) {
  const el = document.getElementById('m-payments-list');
  if (!el) return;
  try {
    const r = await fetch(`/api/manager-action?action=payments&id=${orderId}&token=${encodeURIComponent(managerToken)}`);
    if (!r.ok) { el.innerHTML = '<div style="color:#fca5a5;font-size:12px">Ошибка загрузки платежей</div>'; return; }
    const d = await r.json();
    const pays = d.payments || [];
    if (!pays.length) { el.innerHTML = '<div style="color:#475569;font-size:12px">Платежей нет</div>'; return; }
    el.innerHTML = pays.map(p => {
      const total = p.total_kzt || p.kzt;
      const foreign = p.is_foreign && p.foreign_amount ? ` (${p.foreign_amount} ${p.currency} × ${p.rate})` : '';
      const st = p.status === 'Done' ? '✅' : '⏳';
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:#0f172a;border-radius:8px;margin-bottom:4px;font-size:13px">
        <span style="color:#94a3b8">${st} ${esc(p.method||'—')} · ${p.date||''}</span>
        <span style="font-weight:700;color:#fde047">${total ? total.toLocaleString() + ' ₸' : '—'}${foreign}</span>
      </div>`;
    }).join('');
  } catch { if (el) el.innerHTML = '<div style="color:#fca5a5;font-size:12px">Ошибка</div>'; }
}

function toggleForeignCurrency(on) {
  const el = document.getElementById('m-foreign-fields');
  if (el) el.style.display = on ? 'flex' : 'none';
  if (!on) document.getElementById('m-pay-calc').textContent = '';
}

function calcKzt() {
  const amt  = Number(document.getElementById('m-pay-foreign-amt')?.value || 0);
  const rate = Number(document.getElementById('m-pay-rate')?.value || 0);
  const el   = document.getElementById('m-pay-calc');
  if (el && amt && rate) el.textContent = `≈ ${(amt * rate).toLocaleString()} ₸`;
  // Also fill tenge field
  const kztEl = document.getElementById('m-pay-amount');
  if (kztEl && amt && rate) kztEl.value = Math.round(amt * rate);
}

async function addPayment() {
  const amount    = Number(document.getElementById('m-pay-amount')?.value || 0);
  const methodId  = document.getElementById('m-pay-method')?.value;
  const isForeign = document.getElementById('m-pay-foreign')?.checked;
  const currency  = document.getElementById('m-pay-currency')?.value;
  const foreignAmt= Number(document.getElementById('m-pay-foreign-amt')?.value || 0);
  const rate      = Number(document.getElementById('m-pay-rate')?.value || 0);
  const notes     = document.getElementById('m-pay-notes')?.value;

  if (!amount || amount <= 0) { setModalErr('Введите сумму в тенге'); return; }
  setModalErr('');
  try {
    const r = await fetch(`/api/manager-action?action=pay&token=${encodeURIComponent(managerToken)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        order_id: editOrderId, amount_kzt: amount, method_id: methodId,
        is_foreign: isForeign, foreign_currency: currency,
        foreign_amount: foreignAmt, exchange_rate: rate, notes,
      }),
    });
    if (r.ok) {
      document.getElementById('m-pay-amount').value = '';
      document.getElementById('m-pay-notes').value = '';
      setModalErr('✅ Платёж добавлен');
      await loadPaymentsForOrder(editOrderId);
    } else {
      const d = await r.json(); setModalErr(d.error || 'Ошибка');
    }
  } catch { setModalErr('Ошибка соединения'); }
}

function setModalErr(msg) {
  const el = document.getElementById('modalErr');
  if (el) el.textContent = msg;
}

// ── New Order ─────────────────────────────────────────────────────────────────
let foundContactId = null;

async function openNewOrder() {
  foundContactId = null;
  document.getElementById('no-phone').value = '';
  document.getElementById('no-fname').value = '';
  document.getElementById('no-lname').value = '';
  document.getElementById('no-type').value = '';
  document.getElementById('no-date').value = '';
  document.getElementById('no-people').value = '';
  document.getElementById('no-notes').value = '';
  document.getElementById('no-kitchen').value = '';
  document.getElementById('no-delivery').value = '';
  document.getElementById('no-addr').value = '';
  document.getElementById('no-contact-result').innerHTML = '';
  document.getElementById('noErr').textContent = '';

  // Populate payment methods
  const sel = document.getElementById('no-payment');
  if (sel.options.length <= 1 && allPaymentMethods.length > 0) {
    allPaymentMethods.forEach(m => {
      const o = document.createElement('option');
      o.value = m.id; o.textContent = m.name;
      sel.appendChild(o);
    });
  } else if (sel.options.length <= 1) {
    await loadPaymentMethods();
    allPaymentMethods.forEach(m => {
      const o = document.createElement('option');
      o.value = m.id; o.textContent = m.name;
      sel.appendChild(o);
    });
  }

  const bd = document.getElementById('newOrderBackdrop');
  bd.style.display = 'flex';
}

function closeNewOrder() {
  document.getElementById('newOrderBackdrop').style.display = 'none';
}

let phoneSearchTimer = null;
function onPhoneInput(inp) {
  clearTimeout(phoneSearchTimer);
  const val = inp.value.replace(/\D/g, '');
  if (val.length >= 10) phoneSearchTimer = setTimeout(searchContact, 600);
  else {
    document.getElementById('no-contact-result').innerHTML = '';
    foundContactId = null;
  }
}

async function searchContact() {
  const phone = document.getElementById('no-phone').value.trim();
  if (!phone) return;
  const res = document.getElementById('no-contact-result');
  res.innerHTML = '<span style="color:#64748b;font-size:12px">Ищем...</span>';
  try {
    const r = await fetch(`/api/manager-action?action=contacts&phone=${encodeURIComponent(phone)}&token=${encodeURIComponent(managerToken)}`);
    if (!r.ok) { res.innerHTML = '<span style="color:#fca5a5;font-size:12px">Ошибка поиска</span>'; return; }
    const d = await r.json();
    const contacts = d.contacts || [];
    if (contacts.length > 0) {
      const c = contacts[0];
      foundContactId = c.id;
      const name = [c.fname, c.lname].filter(Boolean).join(' ');
      document.getElementById('no-fname').value = c.fname || '';
      document.getElementById('no-lname').value = c.lname || '';
      res.innerHTML = `<div style="background:#172554;border-radius:8px;padding:8px 10px;font-size:13px;color:#86efac">✅ Найден: ${esc(name)} · ${esc(c.phone||phone)}</div>`;
    } else {
      foundContactId = null;
      res.innerHTML = `<div style="background:#1e1a0e;border-radius:8px;padding:8px 10px;font-size:13px;color:#fde047">⚠️ Клиент не найден — будет создан новый</div>`;
    }
  } catch { res.innerHTML = '<span style="color:#fca5a5;font-size:12px">Ошибка соединения</span>'; }
}

async function submitNewOrder() {
  const phone    = document.getElementById('no-phone').value.trim();
  const fname    = document.getElementById('no-fname').value.trim();
  const lname    = document.getElementById('no-lname').value.trim();
  const type     = document.getElementById('no-type').value.trim();
  const dateVal  = document.getElementById('no-date').value;
  const people   = document.getElementById('no-people').value;
  const methodId = document.getElementById('no-payment').value;
  const notes    = document.getElementById('no-notes').value.trim();
  const kitchen  = document.getElementById('no-kitchen').value.trim();
  const delivery = document.getElementById('no-delivery').value;
  const addr     = document.getElementById('no-addr').value.trim();
  const errEl    = document.getElementById('noErr');

  if (!phone) { errEl.textContent = 'Введите номер телефона'; return; }
  if (!fname) { errEl.textContent = 'Введите имя'; return; }
  errEl.textContent = '';

  const btn = document.querySelector('#newOrderBackdrop .btn-approve');
  if (btn) { btn.disabled = true; btn.textContent = '...'; }

  try {
    // If contact not found — create via manager-action
    let contactId = foundContactId;
    if (!contactId) {
      const rc = await fetch(`/api/manager-action?action=create_contact&token=${encodeURIComponent(managerToken)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, first_name: fname, last_name: lname }),
      });
      if (rc.ok) {
        const dc = await rc.json();
        contactId = dc.id || null;
      }
    }

    const payload = {
      customer_name:  [fname, lname].filter(Boolean).join(' '),
      customer_phone: phone,
      items:          [],
      notes,
      kitchen_notes:  kitchen,
      order_type_title: type || 'Ручной заказ',
      order_date:     dateVal || null,
      people_count:   people ? Number(people) : null,
      payment_method: methodId || null,
      total_price:    0,
      delivery_type:  delivery || null,
      delivery_address: addr || null,
      contact_id:     contactId || null,
    };

    const r = await fetch(`/api/order?token=${encodeURIComponent(managerToken)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await r.json();
    if (r.ok && data.success) {
      closeNewOrder();
      showToast('✅ Заказ создан #' + (data.order_number || ''), 'success');
      await loadOrders();
    } else {
      errEl.textContent = data.error || ('Ошибка ' + r.status);
    }
  } catch (e) {
    errEl.textContent = 'Ошибка соединения';
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '✅ Создать заказ'; }
  }
}

async function loadProductionRecipes() {
  try {
    const r = await fetch(`/api/production?token=${encodeURIComponent(managerToken)}&recipes=1`);
    if (!r.ok) return;
    const d = await r.json();
    allProdRecipes = d.recipes || [];
    const sel = document.getElementById('pf-recipe');
    sel.innerHTML = '<option value="">— Выбрать рецепт —</option>' +
      allProdRecipes.map(rec =>
        `<option value="${rec.id}" data-unit="${esc(rec.unit||'')}" data-uqty="${rec.unit_qty||''}">${esc(rec.name_ru)}</option>`
      ).join('');
  } catch {}
}

function onPFRecipeChange(sel) {
  const opt = sel.options[sel.selectedIndex];
  const unit = opt?.dataset?.unit || '';
  const uqty = opt?.dataset?.uqty || '';
  document.getElementById('pf-unit').textContent = unit ? `Ед.: ${uqty}${unit}` : '';
}

async function submitProdOrder() {
  const recipe_id = document.getElementById('pf-recipe').value;
  const dest      = document.getElementById('pf-dest').value;
  const qty       = document.getElementById('pf-qty').value;
  const date      = document.getElementById('pf-date').value;
  if (!recipe_id || !qty || !date) { alert('Заполните все поля'); return; }
  try {
    const r = await fetch(`/api/production?token=${encodeURIComponent(managerToken)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recipe_id, requested_qty: Number(qty), date, destination: dest, ordered_by: 'manager' }),
    });
    if (r.ok) {
      document.getElementById('pf-recipe').value = '';
      document.getElementById('pf-qty').value = '';
      document.getElementById('pf-unit').textContent = '';
      await loadProductionOrders();
    } else {
      const d = await r.json();
      alert('Ошибка: ' + (d.error || r.status));
    }
  } catch (e) { alert('Ошибка: ' + e.message); }
}

async function loadProductionOrders() {
  isLoadingProd = true;
  document.getElementById('prodList').innerHTML = '<div class="loading"><span class="spinner"></span></div>';
  try {
    const r = await fetch(`/api/production?token=${encodeURIComponent(managerToken)}&range=week`);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    renderProduction(d.records || []);
  } catch {
    document.getElementById('prodList').innerHTML = '<div class="empty">⚠️ Ошибка загрузки</div>';
  } finally { isLoadingProd = false; }
}

function renderProduction(records) {
  if (!records.length) { document.getElementById('prodList').innerHTML = '<div class="empty">Нет заказов на производство</div>'; return; }
  const byDate = {};
  for (const r of records) {
    const d = r.date ? r.date.slice(0,10) : '—';
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(r);
  }
  document.getElementById('prodList').innerHTML = Object.keys(byDate).sort().map(date => `
    <div class="date-group-label">📅 ${fmtDay(date)}</div>
    ${byDate[date].map(r => renderProdCard(r)).join('')}
  `).join('');
}

function renderProdCard(r) {
  const stMap = {
    'הוזמן':       ['ps-new',   'Ожидает'],
    'בייצור':      ['ps-active','В работе'],
    'מוכן':        ['ps-done',  'Готово'],
    'הועבר למלאי': ['ps-sent',  'Передано'],
  };
  const [scls, slabel] = stMap[r.status] || ['ps-new', r.status || 'Ожидает'];
  const destLabel = r.destination === 'לחנות' ? '→ Магазин' : '→ Склад';
  return `<div class="prod-card">
    <div class="prod-card-header">
      <div>
        <div class="prod-name">${esc(r.recipe_name || '—')}</div>
        <div class="prod-dest">${destLabel}</div>
      </div>
      <div style="text-align:right">
        <div class="prod-qty">${r.requested_qty}</div>
        ${r.actual_qty ? `<div style="font-size:11px;color:#86efac">✓ ${r.actual_qty} готово</div>` : ''}
      </div>
    </div>
    <span class="prod-status ${scls}">${slabel}</span>
    ${r.notes ? `<div style="font-size:12px;color:#64748b;margin-top:6px">${esc(r.notes)}</div>` : ''}
    ${r.ordered_by ? `<div style="font-size:11px;color:#475569;margin-top:4px">Заказал: ${esc(r.ordered_by)}</div>` : ''}
    ${r.status === 'הוזמן' ? `<button class="prod-btn" onclick="updateProdStatus('${r.id}','בייצור',this)">🚀 Начать производство</button>` : ''}
    ${r.status === 'בייצור' ? `<button class="prod-btn" style="background:#22c55e" onclick="updateProdStatus('${r.id}','מוכן',this)">✅ Готово</button>` : ''}
    ${r.status === 'מוכן' ? `<button class="prod-btn" style="background:#6366f1" onclick="updateProdStatus('${r.id}','הועבר למלאי',this)">📦 Передать</button>` : ''}
  </div>`;
}

async function updateProdStatus(id, status, btn) {
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  try {
    const r = await fetch(`/api/production?token=${encodeURIComponent(managerToken)}&id=${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status }),
    });
    if (r.ok) await loadProductionOrders();
    else { btn.disabled = false; btn.textContent = 'Ошибка'; }
  } catch { btn.disabled = false; btn.textContent = 'Ошибка'; }
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function fmtDate(iso) {
  const d = new Date(iso);
  const days = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}
function fmtDay(iso) {
  if (iso === '—') return '—';
  const d = new Date(iso + 'T00:00:00');
  const days = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const t = new Date(); const td = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const dd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = (dd - td) / 86400000;
  const prefix = diff === 0 ? 'СЕГОДНЯ — ' : diff === 1 ? 'ЗАВТРА — ' : '';
  return `${prefix}${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()].toUpperCase()}`;
}
function waNum(phone) {
  const d = phone.replace(/\D/g,'');
  return d.startsWith('8') && d.length === 11 ? '7'+d.slice(1) : d;
}

let _notifyTarget = 'chef';

async function openNotifyModal(target) {
  if (!editOrderId) return;
  _notifyTarget = target;
  // Build default message from current order data
  const o = allOrders.find(x => x.id === editOrderId) || {};
  const itemLines = (o.items || []).map(i => `  • ${i.name} × ${i.quantity}`).join('\n');
  const dateStr = o.delivery_at ? new Date(o.delivery_at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Almaty'}) : '';
  const def = [
    `🍽️ Новый заказ №${o.order_number||''}`,
    o.order_type    ? `📋 Тип: ${o.order_type}` : '',
    dateStr         ? `📅 ${dateStr}` : '',
    o.customer      ? `👤 ${o.customer}` : '',
    itemLines       ? `\nСостав:\n${itemLines}` : '',
    o.kitchen_notes ? `💬 ${o.kitchen_notes}` : '',
    o.status        ? `📌 ${o.status}` : '',
  ].filter(Boolean).join('\n');
  document.getElementById('notifyMsgTxt').value = def;
  document.getElementById('notifyMsgRes').style.display = 'none';
  document.getElementById('notifyModal').style.display = 'flex';
  document.getElementById('notifyModalTitle').textContent = target === 'chef' ? '📨 Сообщение шефу' : '📢 Сообщение в группу';
}

function closeNotifyModal() { document.getElementById('notifyModal').style.display = 'none'; }

async function sendNotifyMsg() {
  const btn = document.getElementById('notifySendBtn');
  const msg = document.getElementById('notifyMsgTxt').value.trim();
  const resultEl = document.getElementById('notifyStaffResult');
  const res2 = document.getElementById('notifyMsgRes');
  if (!msg) return;
  btn.disabled = true; btn.textContent = '⏳…';
  try {
    const r = await fetch(`/api/manager-action?action=notify_staff&target=${_notifyTarget}&id=${editOrderId}&token=${encodeURIComponent(managerToken)}&custom=1`, {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ message: msg })
    });
    const d = await r.json().catch(() => ({}));
    if (d.ok) {
      res2.style.display=''; res2.style.color='#86efac'; res2.textContent='✅ Отправлено!';
      setTimeout(closeNotifyModal, 1200);
      if (resultEl) { resultEl.style.display=''; resultEl.style.background='#14532d'; resultEl.style.color='#86efac'; resultEl.textContent = _notifyTarget==='chef' ? '✅ Шеф уведомлён' : '✅ Группа уведомлена'; }
    } else {
      res2.style.display=''; res2.style.color='#f87171'; res2.textContent='⚠️ ' + (d.error||'Ошибка');
      btn.disabled=false; btn.textContent='✅ Отправить';
    }
  } catch(e) {
    res2.style.display=''; res2.style.color='#f87171'; res2.textContent='⚠️ Ошибка соединения';
    btn.disabled=false; btn.textContent='✅ Отправить';
  }
}
function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const savedToken = localStorage.getItem('manager_token');
if (savedToken) { managerToken = savedToken; initApp(); }
document.getElementById('tokenInput')?.addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
